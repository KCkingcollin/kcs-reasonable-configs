source = ~/.config/castle-shell/hypr-colors.conf

background {
    monitor =
    path = /home/kckingcollin/Pictures/background.jpg
    color = rgba(25, 20, 20, 0.15)
    blur_passes = 2
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = $prime_color
    check_color = $alt_color

    # outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    # check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    

    placeholder_text = 
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

shape {
    monitor =
    size = 40, 40
    color = rgba(0, 0, 0, 0.0) # no fill
    rounding = 15
    border_size = 3
    border_color = $prime_color

    position = 20, -20
    halign = left
    valign = top

    onclick = hyprctl switchxkblayout current next
}

label {
    monitor =
    text = cmd[update:500] echo $LAYOUT[en,de]    
    color = rgba(200, 200, 200, 1.0)
    font_size = 18

    position = 26, -22
    halign = left
    valign = top
}

